name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,circuit]
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Animation data self-check
        # Needs no Manim: verifies the physics feeding the scenes (seam
        # divergence steps, the -1 holonomy, the allowed momenta, the winding
        # numbers). If this drifts, the animations are wrong before they render.
        run: python animations/_data.py
